# The wrapper app: a window that shows the app's web interface and nothing else, starts and
# supervises the sandboxes, and asks for approval in a window of its own.
#
# This is a workspace of its own, with its own lock file, so that the gateway's build (which
# copies the other workspace into its image) does not depend on the wrapper's many
# dependencies.

[package]
name = "triage-wrapper"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace]

[dependencies]
serde_json = "1"
triage-host = { path = "../host" }
# The web view and window libraries that Tauri is built on, without the framework: no bridge
# between pages and native code, and a third of the dependencies. Versions are exact, and
# were at least seven days old when chosen; see README.md on updating them.
# `mac-proxy` makes the web view on macOS (14 or later) use the proxy it is given.
tao = "=0.37.3"
wry = { version = "=0.57.3", features = ["mac-proxy"] }

# The menu bar, without which copy and paste do not work in a window on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "=0.21.2"
# For the content rule list (see view.rs). These are the versions that wry itself uses.
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSError",
    "NSString",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKUserContentController",
] }

[dev-dependencies]

[[bin]]
name = "email-triage"
path = "src/main.rs"
