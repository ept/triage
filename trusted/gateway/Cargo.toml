[package]
name = "triage-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures-util = "0.3.34"
mail-builder = "2.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }
utf7-imap = "0.3.2"
uuid = { version = "1.29.3", features = ["v4"] }
webpki-roots = "1.0.12"

[dev-dependencies]
tempfile = "3.27.0"
