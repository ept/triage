[project]
name = "triage"
version = "0.1.0"
description = "Email Triage: the app that runs inside the email sandbox"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "nh3>=0.3",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "mypy>=1.15",
    "playwright>=1.48",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.uv]
# Dependency cooldown (see SPEC.md): do not resolve to releases younger than
# this date. Move it forward when updating dependencies, keeping it at least
# seven days in the past unless a release fixes a published vulnerability.
exclude-newer = "2026-11-19T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's test client still works with httpx, which is what the app itself uses.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF", "S", "PT"]
ignore = [
    "S101",   # assert is fine in tests and for internal invariants
    "S311",   # random is not used for security purposes
    "RUF001", # ambiguous unicode characters appear deliberately in test data
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests contain long literal strings (attack samples), and loops inside pytest.raises that
# record how far a stream got before it failed.
"tests/**" = ["S", "B011", "E501", "PT012"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/triage"]
